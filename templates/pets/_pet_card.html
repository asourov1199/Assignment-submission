<div class="col">
    <div class="card h-100 shadow-sm pet-card">
        {% if pet.image %}
            <img src="{{ pet.image.url }}" class="card-img-top pet-image" alt="{{ pet.name }}">
        {% else %}
            <div class="pet-placeholder">🐾</div>
        {% endif %}
        <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start mb-2">
                <h5 class="card-title mb-0">{{ pet.name }}</h5>
                {% if pet.status == 'Available' %}
                    <span class="badge text-bg-success">Available</span>
                {% else %}
                    <span class="badge text-bg-secondary">Adopted</span>
                {% endif %}
            </div>
            <p class="text-muted small mb-2">{{ pet.animal_type }} · {{ pet.breed }}</p>
            <p class="mb-1"><strong>Age:</strong> {{ pet.age }} year{{ pet.age|pluralize }}</p>
            <p class="mb-1"><strong>Gender:</strong> {{ pet.gender }}</p>
            <p class="mb-3"><strong>Location:</strong> {{ pet.location }}</p>
            <a class="btn btn-outline-dark mt-auto" href="{% url 'pet_detail' pet.pk %}">View Details</a>
        </div>
    </div>
</div>
