{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 560px;">
    <h1 class="fw-bold">Login</h1>
    <p class="text-muted">Login to submit and track adoption requests.</p>
    <form method="post" class="card card-body shadow-sm p-4 mt-4">
        {% csrf_token %}
        {% if form.errors %}<div class="alert alert-danger">Your username or password is incorrect.</div>{% endif %}
        <div class="mb-3"><label class="form-label" for="id_username">Username</label><input class="form-control" type="text" name="username" autofocus required id="id_username"></div>
        <div class="mb-3"><label class="form-label" for="id_password">Password</label><input class="form-control" type="password" name="password" required id="id_password"></div>
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button class="btn btn-dark btn-lg">Login</button>
    </form>
    <p class="mt-3">No account? <a href="{% url 'register' %}">Create one</a>.</p>
</div>
{% endblock %}
